name: Hostinger external MCP smoke

on:
  push:
    branches: [chatgpt-plugin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public health and OAuth readiness
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://instagram-mcp.secretssystem.online"
          code="$(curl --retry 3 --retry-delay 3 -sS -m 15 -o /tmp/instagram-health.json -w '%{http_code}' "$BASE/health")"
          test "$code" = "200" || { echo "Expected /health 200, received $code"; cat /tmp/instagram-health.json; exit 1; }
          python3 -c 'import json; s=json.load(open("/tmp/instagram-health.json")); assert s["service"]=="instagram-agent" and s["auth"]=="oidc-required" and s["ready"] is True, s'
          echo "PASS: public health endpoint and OIDC configuration are active."
      - name: Verify OAuth protected-resource metadata
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://instagram-mcp.secretssystem.online"
          code="$(curl --retry 3 --retry-delay 3 -sS -m 15 -o /tmp/instagram-resource.json -w '%{http_code}' "$BASE/.well-known/oauth-protected-resource")"
          test "$code" = "200" || { echo "Expected protected-resource metadata 200, received $code"; cat /tmp/instagram-resource.json; exit 1; }
          python3 -c 'import json; j=json.load(open("/tmp/instagram-resource.json")); assert j["resource"]=="https://instagram-mcp.secretssystem.online/mcp" and len(j["authorization_servers"])>0 and "instagram:analyze" in j["scopes_supported"], j'
          echo "PASS: OAuth resource metadata is published."
      - name: Verify anonymous MCP access requires a bearer token
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://instagram-mcp.secretssystem.online"
          code="$(curl --retry 3 --retry-delay 3 -sS -m 15 -D /tmp/instagram-mcp-headers.txt -o /tmp/instagram-mcp.json -w '%{http_code}' -X POST "$BASE/mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          test "$code" = "401" || { echo "Expected anonymous /mcp 401, received $code"; cat /tmp/instagram-mcp.json; exit 1; }
          grep -qi '^www-authenticate: Bearer' /tmp/instagram-mcp-headers.txt
          python3 -c 'import json; j=json.load(open("/tmp/instagram-mcp.json")); assert j.get("error")=="BEARER_REQUIRED", j'
          echo "PASS: anonymous MCP requests are rejected with OAuth challenge."
      - name: Verify disallowed origin is rejected
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://instagram-mcp.secretssystem.online"
          code="$(curl --retry 3 --retry-delay 3 -sS -m 15 -o /tmp/instagram-origin.json -w '%{http_code}' -X POST "$BASE/mcp" -H 'Content-Type: application/json' -H 'Origin: https://attacker.invalid' --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')"
          test "$code" = "403" || { echo "Expected disallowed origin 403, received $code"; cat /tmp/instagram-origin.json; exit 1; }
          python3 -c 'import json; j=json.load(open("/tmp/instagram-origin.json")); assert j.get("error")=="ORIGIN_NOT_ALLOWED", j'
          echo "PASS: untrusted Origin is rejected."
