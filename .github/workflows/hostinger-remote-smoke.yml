name: Hostinger external MCP smoke

on:
  push:
    branches: [chatgpt-plugin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS health endpoint
        shell: bash
        run: |
          set -euo pipefail
          HEALTH_URL="https://instagram-mcp.secretssystem.online/health"
          code="$(curl --retry 3 --retry-delay 5 -sS -m 15 -o /tmp/instagram-health.json -w '%{http_code}' "$HEALTH_URL")"
          test "$code" = "200" || { echo "Expected /health 200, received $code"; exit 1; }
          python3 -c 'import json; s=json.load(open("/tmp/instagram-health.json")); assert s["service"]=="instagram-agent" and s["auth"]=="locked" and s["ready"] is False, s'
      - name: Verify anonymous tool access is blocked
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-delay 5 -sS -m 15 -o /tmp/instagram-mcp.json -w '%{http_code}'             -X POST 'https://instagram-mcp.secretssystem.online/mcp'             -H 'Content-Type: application/json'             --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          test "$code" = "503" || { echo "Expected locked /mcp 503, received $code"; exit 1; }
          python3 -c 'import json; j=json.load(open("/tmp/instagram-mcp.json")); assert j.get("error")=="MCP_AUTH_NOT_CONFIGURED", j'
          echo 'PASS: remote MCP locked without OAuth and health endpoint available.'
